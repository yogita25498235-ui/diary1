<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>My Private Diary</title>

    <link rel="stylesheet" href="style.css">

</head>

<body class="diary-body">

    <header class="topbar">

        <div class="brand">
            📖 <span>Private Diary</span>
        </div>

        <div class="user-area">

            <span id="welcomeUser">
                User
            </span>

            <button class="theme-btn" id="btn" onclick="toggleTheme()">
                🌙
            </button>

            <button class="logout-btn" id="btn" onclick="logout()">
                🚪 Logout
            </button>

        </div>

    </header>


    <main class="diary-container">

        <section class="diary-heading">

            <p id="todayDate"></p>

            <h1>
                Dear <span>Diary...</span> ✨
            </h1>

            <p>
                This is your private space. Write anything you want.
            </p>

        </section>


        <section class="paper">

            <div class="paper-top">

                <span class="date-label">
                    📅 <span id="entryDate"></span>
                </span>

                <span class="save-status" id="saveStatus">
                    Ready ✨
                </span>

            </div>


            <input type="text" id="entryTitle" class="entry-title" placeholder="Today's title..." maxlength="100">


            <textarea id="entryContent" class="entry-content" placeholder="Dear diary, today I..."></textarea>


            <div class="paper-bottom">

                <div class="counter">

                    <span id="wordCount">0</span>
                    words ·
                    <span id="charCount">0</span>
                    characters

                </div>

                <button class="save-btn" id="saveBtn" onclick="saveEntry()">
                    💾 Save Entry
                </button>
                <audio id="clickSound"
                    src="C:\Users\Dell\OneDrive\Desktop\don't touch\freesound_gamestudio-button-394464.mp3"
                    preload="auto"></audio>

            </div>

        </section>


        <section class="entries-section">

            <div class="section-title">

                <h2>
                    📚 My Memories
                </h2>

                <span id="entryNumber">
                    0 entries
                </span>

            </div>


            <input type="search" id="search" class="search-box" placeholder="🔍 Search your memories..."
                oninput="displayEntries()">


            <div id="entriesContainer" class="entries-grid"></div>

        </section>

    </main>


    <div id="toast" class="toast"></div>


    <script>

        const currentUser =
            localStorage.getItem("currentUser");

        if (!currentUser) {

            window.location.href =
                "index.html";
        }

        document.getElementById(
            "welcomeUser"
        ).textContent =
            "👤 " + currentUser;

        const diaryKey =
            "diary_" + currentUser;

        let entries =
            JSON.parse(
                localStorage.getItem(diaryKey) || "[]"
            );


        let editingId = null;

        const title =
            document.getElementById("entryTitle");

        const content =
            document.getElementById("entryContent");

        const wordCount =
            document.getElementById("wordCount");

        const charCount =
            document.getElementById("charCount");

        const saveStatus =
            document.getElementById("saveStatus");

        const entriesContainer =
            document.getElementById("entriesContainer");

        function setDate() {

            const now = new Date();

            const formatted =
                now.toLocaleDateString(
                    "en-IN",
                    {
                        weekday: "long",
                        day: "numeric",
                        month: "long",
                        year: "numeric"
                    }
                );

            document.getElementById(
                "todayDate"
            ).textContent = formatted;

            document.getElementById(
                "entryDate"
            ).textContent = formatted;
        }

        setDate();


        content.addEventListener(
            "input",
            updateCounter
        );


        function updateCounter() {

            const text =
                content.value.trim();

            const words =
                text === ""
                    ? 0
                    : text.split(/\s+/).length;

            wordCount.textContent =
                words;

            charCount.textContent =
                content.value.length;

            saveStatus.textContent =
                "Editing... ✍️";
        }

        function saveEntry() {

            const entryTitle =
                title.value.trim();

            const entryContent =
                content.value.trim();


            if (!entryTitle && !entryContent) {

                showToast(
                    "Write something first ✍️"
                );

                return;
            }


            if (editingId !== null) {

                const index =
                    entries.findIndex(
                        e => e.id === editingId
                    );

                if (index !== -1) {

                    entries[index].title =
                        entryTitle || "Untitled";

                    entries[index].content =
                        entryContent;

                    entries[index].updated =
                        new Date().toLocaleString();

                }

                editingId = null;

            } else {

                const entry = {

                    id: Date.now(),

                    title:
                        entryTitle || "Untitled",

                    content:
                        entryContent,

                    date:
                        new Date().toLocaleString()

                };

                entries.unshift(entry);
            }


            saveData();

            clearEditor();

            displayEntries();

            saveStatus.textContent =
                "Saved ✓";

            showToast(
                "Your memory has been saved 🔐"
            );
        }
        const authBtn = document.getElementById("saveBtn");
        const clickSound = document.getElementById("clickSound");

        authBtn.addEventListener("click", function () {
            clickSound.currentTime = 0;
            clickSound.play();
        });

        function saveData() {

            localStorage.setItem(
                diaryKey,
                JSON.stringify(entries)
            );
        }
        function displayEntries() {

            const search =
                document.getElementById(
                    "search"
                ).value
                    .toLowerCase();


            const filtered =
                entries.filter(entry =>

                    entry.title
                        .toLowerCase()
                        .includes(search)

                    ||

                    entry.content
                        .toLowerCase()
                        .includes(search)
                );


            entriesContainer.innerHTML = "";


            document.getElementById(
                "entryNumber"
            ).textContent =
                entries.length +
                (entries.length === 1
                    ? " entry"
                    : " entries");


            if (filtered.length === 0) {

                entriesContainer.innerHTML = `

            <div class="empty-state">

                <div>📖</div>

                <h3>
                    No memories yet
                </h3>

                <p>
                    Your diary is waiting for your story.
                </p>

            </div>

        `;

                return;
            }


            filtered.forEach(entry => {

                const card =
                    document.createElement("article");

                card.className =
                    "memory-card";


                card.innerHTML = `

            <div class="memory-icon">
                💜
            </div>

            <small>
                ${escapeHTML(
                    entry.updated ||
                    entry.date
                )}
            </small>

            <h3>
                ${escapeHTML(entry.title)}
            </h3>

            <p>
                ${escapeHTML(entry.content)}
            </p>

            <div class="card-buttons">

                <button
                    onclick="editEntry(${entry.id})"
                >
                    ✏️ Edit
                </button>

                <button
                    class="delete"
                    onclick="deleteEntry(${entry.id})"
                >
                    🗑️ Delete
                </button>

            </div>

        `;

                entriesContainer.appendChild(card);
            });
        }

        function editEntry(id) {

            const entry =
                entries.find(
                    e => e.id === id
                );

            if (!entry) return;


            title.value =
                entry.title;

            content.value =
                entry.content;

            editingId =
                id;

            updateCounter();


            window.scrollTo({
                top: 0,
                behavior: "smooth"
            });


            showToast(
                "Editing your memory ✏️"
            );
        }

        function deleteEntry(id) {

            if (
                !confirm(
                    "Are you sure you want to delete this memory?"
                )
            ) {
                return;
            }


            entries =
                entries.filter(
                    e => e.id !== id
                );


            saveData();

            displayEntries();

            showToast(
                "Memory deleted 🗑️"
            );
        }

        function clearEditor() {

            title.value = "";

            content.value = "";

            editingId = null;

            updateCounter();

            saveStatus.textContent =
                "Ready ✨";
        }

        function logout() {

            if (
                !confirm(
                    "Do you want to logout?"
                )
            ) {
                return;
            }


            localStorage.removeItem(
                "currentUser"
            );


            window.location.href =
                "index.html";
        }

        function toggleTheme() {

            document.body.classList.toggle(
                "dark-mode"
            );


            localStorage.setItem(
                "diaryTheme",
                document.body.classList.contains(
                    "dark-mode"
                )
                    ? "dark"
                    : "light"
            );
        }


        if (
            localStorage.getItem(
                "diaryTheme"
            ) === "dark"
        ) {

            document.body.classList.add(
                "dark-mode"
            );
        }

        function showToast(text) {

            const toast =
                document.getElementById(
                    "toast"
                );

            toast.textContent =
                text;

            toast.classList.add(
                "show"
            );


            setTimeout(() => {

                toast.classList.remove(
                    "show"
                );

            }, 2500);
        }

        function escapeHTML(text) {

            const div =
                document.createElement(
                    "div"
                );

            div.textContent =
                text;

            return div.innerHTML;
        }

        document.addEventListener(
            "keydown",
            function (e) {

                if (
                    (e.ctrlKey || e.metaKey) &&
                    e.key.toLowerCase() === "s"
                ) {

                    e.preventDefault();

                    saveEntry();
                }

            }
        );

        displayEntries();
        updateCounter();

    </script>

</body>

</html>
